<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Catalogue</title>
<style>body{font-family:system-ui,sans-serif;display:flex;min-height:90vh;align-items:center;justify-content:center;background:#f4f4f4}form{background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 10px #0002;width:min(90vw,340px)}input,button{width:100%;box-sizing:border-box;font-size:18px;padding:12px;margin-top:10px}#m{color:#b00;min-height:1.2em}</style></head>
<body><form id="f"><b>Private catalogue</b><input id="p" type="password" autocomplete="current-password" placeholder="Password" autofocus><label style="display:block;margin-top:8px"><input id="r" type="checkbox" style="width:auto"> Remember on this device</label><button>Open</button><div id="m"></div></form>
<script>
const S="PZeK/1g52HwXKnsdlBwEMw==",V="d5EbL4zHyNK1Kjyu",IT=600000;const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function go(pw,auto){const m=document.getElementById('m');m.textContent='Unlocking…';try{
const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(S),iterations:IT,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
const ct=await (await fetch('payload.bin?v='+V.slice(0,8),{cache:'no-cache'})).arrayBuffer();
const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(V)},k,ct);
const html=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
if(document.getElementById('r').checked)localStorage.setItem('cpw',pw);
document.open();document.write(html);document.close();
}catch(e){if(auto)localStorage.removeItem('cpw');m.textContent=e.name==='OperationError'?'Wrong password':'Error: '+e.message;}}
document.getElementById('f').onsubmit=e=>{e.preventDefault();go(document.getElementById('p').value)};
const sv=localStorage.getItem('cpw');if(sv){document.getElementById('r').checked=true;go(sv,1)}
</script></body></html>
